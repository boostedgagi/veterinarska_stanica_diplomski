security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
#        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User: 'bcrypt'
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: 'bcrypt'
            cost: 15

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        login:
            pattern: ^/login_check
            user_checker: App\Security\UserChecker
            stateless: true
            json_login:
                check_path: /login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/
            stateless: true
            jwt: ~

    # Only the *first* rule that matches a request is used.
    # Default deny: every route needs a logged-in user (all users have ROLE_USER) unless it is
    # listed as public here. Admin-only actions additionally carry #[IsGranted('ROLE_ADMIN')].
    # tests/Unit/Security/AccessControlTest.php checks every route against this list.
    access_control:
        # authentication
        - { path: ^/login_check$, roles: PUBLIC_ACCESS }
        # registration and account verification (link from the welcome mail)
        - { path: ^/user$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/verify_account$, methods: [GET], roles: PUBLIC_ACCESS }
        # forgotten password (request mail, then set the new one with the mailed token)
        - { path: ^/password/(request_new|make_new)$, methods: [POST], roles: PUBLIC_ACCESS }
        # page opened by scanning a pet's QR code
        - { path: ^/found_pet$, methods: [GET], roles: PUBLIC_ACCESS }
        # vet lists shown before login
        - { path: ^/(vets/simplified|active_vets)$, methods: [GET], roles: PUBLIC_ACCESS }
        # API documentation (Swagger UI and OpenAPI JSON)
        - { path: ^/doc(\.json)?$, methods: [GET], roles: PUBLIC_ACCESS }
        # everything else
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon