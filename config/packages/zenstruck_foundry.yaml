when@dev: &dev
    # See full configuration: https://symfony.com/bundles/ZenstruckFoundryBundle/current/index.html#full-default-bundle-configuration
    zenstruck_foundry:
        persistence:
            # Flush once per factory call instead of after every object (forced to true in Foundry 3)
            flush_once: true
        # PHP 8.4 native lazy objects (forced to true in Foundry 3)
        enable_auto_refresh_with_lazy_objects: true
        orm:
            reset:
                # Build the test schema from the mapping (what tests/DatabasePrimer.php did before)
                mode: schema

when@test: *dev
