framework:
    messenger:
        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # Kept for later: needs a worker (`messenger:consume async`), see UPGRADE_PLAN.md section 9.
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            sync: 'sync://'

        routing:
            # Chat messages are handled inside the request: there is no worker running anywhere,
            # so with 'async' they were never saved. To go async again: route to 'async', run a
            # worker and add a failure_transport.
            'App\Message\Message': sync
