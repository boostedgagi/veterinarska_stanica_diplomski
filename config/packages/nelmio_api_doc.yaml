nelmio_api_doc:
    documentation:
        info:
            title: vetShopBackEnd
            description: This is app that offers scheduling appointments for pet health care.
            version: 1.0.0
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        # Every operation needs a JWT unless its action says #[Security(name: null)]
        # (mirrors the default-deny access_control in security.yaml).
        security:
            - Bearer: []
    areas:
        path_patterns:
                - ^/